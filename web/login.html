<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 小艺中控</title><link rel="stylesheet" href="/login.css"><script src="/login.js" defer></script></head><body><main><span class="logo">✳</span><h1>登录小艺中控</h1><p>登录后自动连接，无需填写服务访问口令。</p><form id="login"><label for="username">账号</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200"><p id="error" role="alert"></p><button id="submit">登录</button></form><small>在此浏览器保持登录 30 天。使用共享电脑后请退出登录。</small></main></body></html>
